name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag matching the package version
        shell: python
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")
          kind = subprocess.check_output(
              ["git", "cat-file", "-t", f"refs/tags/{tag}"], text=True
          ).strip()
          if kind != "tag":
              raise SystemExit(f"{tag} must be an annotated tag containing the release notes")
          with pathlib.Path("nanami/Cargo.toml").open("rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match Nanami version {version}")
          commit = subprocess.check_output(
              ["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True
          ).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != head:
              raise SystemExit("Release tag does not point to the checked-out commit")

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release-artifacts'
          path: dist
      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for target in x86_64-pc99 aarch64-qemu; do
            artifact_dir="dist/${target}-release-artifacts"
            test -s "$artifact_dir/nanami.img"
            if [[ "$target" == aarch64-qemu ]]; then
              test -s "$artifact_dir/rootfs.img"
              test -s "$artifact_dir/u-boot.bin"
            fi
            (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
            tar -C "$artifact_dir" -czf "release-assets/nanami-${GITHUB_REF_NAME}-${target}.tar.gz" .
          done
          (cd release-assets && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Create GitHub Release from tag notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.tar.gz release-assets/SHA256SUMS \
            --title "Nanami $GITHUB_REF_NAME" --notes-from-tag --verify-tag
