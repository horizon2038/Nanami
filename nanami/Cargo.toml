[package]
name = "nanami"
version = "0.6.0"
edition = "2021"

[features]
alpha-entry = []

[[bin]]
name = "alpha"
path = "src/alpha_main.rs"
required-features = ["alpha-entry"]

[dependencies]
nanami-uapi = { path = "servers/uapi" }
nun = { path = "../spencer/Nun" }
a9n_abi = "=0.8.0"
crabtime = { version = "1.1.4", default-features = false }
libm = { version = "0.2", default-features = false }
