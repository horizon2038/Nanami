[package]
name = "hpet_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hpet_server"
path = "../timer-server/src/main.rs"

[dependencies]
nanami-runtime = { path = "../../libs/nanami-runtime" }
nanami-client = { path = "../../libs/nanami-client" }

[features]
default = ["hpet"]
