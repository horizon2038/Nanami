# Keep test assertion output serialized with Alpha on core 0. Other ordinary
# servers retain their normal affinity; this is external fixture policy.
@process ./modules/import-manager services=1 affinity=0
@process ./modules/handover-node affinity=0
@process ./bin/driver-manager priority=30 platform=1
@process ./bin/hpet-server priority=30
@process ./bin/acpi-server priority=28 affinity=0
@process ./bin/usb-server priority=28
@process ./bin/ahci-server priority=23
@process ./bin/virtio-blk-server priority=23
import-manager 20 ./modules/import-manager
platform 31 ./bin/driver-manager
clock 22 ./bin/rtc-server
filesystem 22 ./bin/ext2-server
startup 20 ./bin/system-manager
@alpha relay 30 ./nanami/alpha - ./modules/relay.conf after=terminal-service
@import relay middle-door-5 upstream-only-4 1
